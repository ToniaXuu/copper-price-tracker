name: 自动更新沪铜价格数据

on:
  # 定时调度**不在 GitHub 上**：本项目统一由 cron-job.org 在 08:30（北京时间）调
  # workflow_dispatch API 精确触发。GitHub 原生 schedule 常延迟 5~20 分钟，且会和
  # 外部 cron 抢着提交 data.json（偶发非快进冲突），故刻意不启用 schedule。
  # cron-job.org 配置（如需重建）：
  #   URL:    https://api.github.com/repos/ToniaXuu/copper-price-tracker/actions/workflows/update-copper.yml/dispatches
  #   Method: POST
  #   Header: Authorization: Bearer <Fine-grained PAT, 需 actions:write>
  #           Accept: application/vnd.github+json
  #   Body:   {"ref":"main"}
  #   计划:   每天 08:30 Asia/Shanghai

  # 手动触发（也是 cron-job.org 实际调用的入口）
  workflow_dispatch:

jobs:
  update-copper:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # 允许自动提交

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install requests

      - name: 运行数据更新脚本
        run: python scripts/update_copper.py

      - name: 检查是否有数据变更
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain data.json) ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ 检测到 data.json 有更新"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "⏭️ data.json 无变化，跳过提交"
          fi

      - name: 提交并推送更新
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "data: 自动更新沪铜价格数据 [skip ci]"
          git push

      - name: 发送每日通知（微信+钉钉）
        # always()：更新脚本若因「主指标数据源全灭」而失败退出，默认会跳过后续步骤，
        # 告警就送不出去了。这里保证通知照发，并把数据源故障一并带上。
        if: always()
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: python scripts/send_notification.py "${{ steps.check_changes.outputs.changed }}"
